[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvlse"
version = "0.1.0"
description = "Mixed-variable level-set estimation for black-box simulators, after Pelamatti et al. (2020)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "gaussian-process",
    "kriging",
    "level-set-estimation",
    "mixed-variable",
    "surrogate-model",
    "active-learning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "pillow>=10.0"]
tables = ["pandas>=2.0"]
parallel = ["joblib>=1.3"]
notebooks = ["jupyterlab>=4.0", "matplotlib>=3.7", "pandas>=2.0", "pillow>=10.0"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=10.0",
    "joblib>=1.3",
]

[project.scripts]
mvlse = "mvlse.cli:main"

[tool.setuptools.packages.find]
include = ["mvlse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks are teaching artefacts: their cells are written to be read in sequence and
# pasted, not to satisfy an import-order or line-length rule.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E731",  # the benchmark catalogue reads better with small lambdas for base surfaces
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
